[project]
name = "ecommerce-ops-agent"
version = "0.1.0"
description = "AI-powered e-commerce operations manager — LangGraph + FastMCP"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "fastmcp>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.9.0",
    "python-dotenv>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=5.5.1",
    "gradio>=4.0.0",
    "asyncpg>=0.29.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langsmith>=0.8.9",
    "deepeval>=4.0.5",
    "textual>=8.2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "mcp_server", "memory", "tools", "observability"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langsmith>=0.1.0",
]
